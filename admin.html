<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARTEA — Ordini</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background: #f5f3ef;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .login {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: .85;
        }

        .error {
            color: #c62828;
            margin-top: 12px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.05);
        }

        .stat-title {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: bold;
        }

        .sales {
            color: #198754;
        }

        .filters {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.05);
        }

        .filters-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .filters input {
            margin: 0;
            flex: 1;
        }

        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            font-size: 14px;
        }

        .orders {
            display: grid;
            gap: 20px;
        }

        .order {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .order-number {
            font-size: 22px;
            font-weight: bold;
        }

        .stripe-id {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            word-break: break-all;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #eee;
        }

        .status-paid {
            background: #dff5e8;
            color: #147a42;
        }

        .status-preparing {
            background: #fff0c7;
            color: #8a6200;
        }

        .status-shipped {
            background: #dcecff;
            color: #1559a6;
        }

        .status-delivered {
            background: #e5dcff;
            color: #6040a0;
        }

        .customer {
            margin-bottom: 20px;
        }

        .customer div {
            margin: 6px 0;
        }

        .shipping {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .products {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            margin-bottom: 15px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 7px 0;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .status-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .empty {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            color: #777;
        }

        .results-info {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #adminPanel {
            display: none;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .topbar-actions {
                width: 100%;
            }

            .topbar-actions button {
                flex: 1;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .filters-row {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-row input,
            .filters-row select,
            .filters-row button {
                width: 100%;
            }

            .order-header {
                flex-direction: column;
            }

            .product {
                flex-direction: column;
                gap: 3px;
            }

        }

    </style>

</head>

<body>


    <!-- =================================================
         LOGIN
         ================================================= -->

    <div
        id="loginPanel"
        class="login"
    >

        <h1>ARTEA</h1>

        <p>
            Accesso amministratore
        </p>

        <form id="loginForm">

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Accedi
            </button>

        </form>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>


    <!-- =================================================
         PANNELLO ADMIN
         ================================================= -->

    <div
        id="adminPanel"
        class="container"
    >

        <div class="topbar">

            <div>

                <h1>
                    ARTEA — Ordini
                </h1>

                <div>
                    Pannello amministratore
                </div>

            </div>


            <div class="topbar-actions">

                <button
                    id="refreshButton"
                >
                    ↻ Aggiorna
                </button>

                <button
                    id="logoutButton"
                >
                    Esci
                </button>

            </div>

        </div>


        <!-- =================================================
             STATISTICHE
             ================================================= -->

        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    ORDINI TOTALI
                </div>

                <div
                    id="totalOrders"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    PAGATI
                </div>

                <div
                    id="paidOrders"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    IN PREPARAZIONE
                </div>

                <div
                    id="preparingOrders"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    SPEDITI
                </div>

                <div
                    id="shippedOrders"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    VENDITE
                </div>

                <div
                    id="totalSales"
                    class="stat-value sales"
                >
                    €0,00
                </div>

            </div>

        </div>


        <!-- =================================================
             RICERCA E FILTRI
             ================================================= -->

        <div class="filters">

            <div class="filters-row">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="🔎 Cerca ordine, nome o email..."
                >


                <select
                    id="statusFilter"
                >

                    <option value="all">
                        Tutti gli stati
                    </option>

                    <option value="paid">
                        Pagati
                    </option>

                    <option value="preparing">
                        In preparazione
                    </option>

                    <option value="shipped">
                        Spediti
                    </option>

                    <option value="delivered">
                        Consegnati
                    </option>

                </select>


                <button
                    id="clearFiltersButton"
                >
                    Azzera
                </button>

            </div>

        </div>


        <div
            id="resultsInfo"
            class="results-info"
        ></div>


        <!-- =================================================
             ORDINI
             ================================================= -->

        <div
            id="orders"
            class="orders"
        ></div>

    </div>


    <script>

        let allOrders = [];


        const loginPanel =
            document.getElementById(
                "loginPanel"
            );


        const adminPanel =
            document.getElementById(
                "adminPanel"
            );


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const loginError =
            document.getElementById(
                "loginError"
            );


        const ordersContainer =
            document.getElementById(
                "orders"
            );


        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        const refreshButton =
            document.getElementById(
                "refreshButton"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const statusFilter =
            document.getElementById(
                "statusFilter"
            );


        const clearFiltersButton =
            document.getElementById(
                "clearFiltersButton"
            );


        const resultsInfo =
            document.getElementById(
                "resultsInfo"
            );


        /* =================================================
           CONTROLLO LOGIN
           ================================================= */

        async function checkLogin() {

            try {

                const response =
                    await fetch(
                        "/api/admin/check"
                    );


                if (response.ok) {

                    showAdmin();

                    loadEverything();

                } else {

                    showLogin();

                }

            } catch {

                showLogin();

            }

        }


        /* =================================================
           MOSTRA LOGIN
           ================================================= */

        function showLogin() {

            loginPanel.style.display =
                "block";

            adminPanel.style.display =
                "none";

        }


        /* =================================================
           MOSTRA ADMIN
           ================================================= */

        function showAdmin() {

            loginPanel.style.display =
                "none";

            adminPanel.style.display =
                "block";

        }


        /* =================================================
           LOGIN
           ================================================= */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                loginError.textContent = "";


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                try {

                    const response =
                        await fetch(
                            "/api/admin/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        password:
                                            password
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        loginError.textContent =
                            data.error ||
                            "Accesso negato.";

                        return;

                    }


                    document.getElementById(
                        "password"
                    ).value = "";


                    showAdmin();

                    loadEverything();

                } catch {

                    loginError.textContent =
                        "Errore di connessione.";

                }

            }
        );


        /* =================================================
           LOGOUT
           ================================================= */

        logoutButton.addEventListener(
            "click",
            async function() {

                await fetch(
                    "/api/admin/logout",
                    {
                        method: "POST"
                    }
                );

                showLogin();

            }
        );


        /* =================================================
           AGGIORNA
           ================================================= */

        refreshButton.addEventListener(
            "click",
            async function() {

                refreshButton.disabled =
                    true;

                refreshButton.textContent =
                    "Aggiornamento...";


                await loadEverything();


                refreshButton.disabled =
                    false;

                refreshButton.textContent =
                    "↻ Aggiorna";

            }
        );


        /* =================================================
           CARICA TUTTO
           ================================================= */

        async function loadEverything() {

            await Promise.all([
                loadOrders(),
                loadStats()
            ]);

        }


        /* =================================================
           STATISTICHE
           ================================================= */

        async function loadStats() {

            try {

                const response =
                    await fetch(
                        "/api/admin/stats"
                    );


                if (
                    response.status === 401
                ) {

                    showLogin();

                    return;

                }


                const stats =
                    await response.json();


                document.getElementById(
                    "totalOrders"
                ).textContent =
                    stats.totalOrders;


                document.getElementById(
                    "paidOrders"
                ).textContent =
                    stats.paidOrders;


                document.getElementById(
                    "preparingOrders"
                ).textContent =
                    stats.preparingOrders;


                document.getElementById(
                    "shippedOrders"
                ).textContent =
                    stats.shippedOrders;


                document.getElementById(
                    "totalSales"
                ).textContent =
                    "€" +
                    Number(
                        stats.totalSalesFormatted
                    )
                    .toLocaleString(
                        "it-IT",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    );

            } catch (error) {

                console.error(
                    "Errore statistiche:",
                    error
                );

            }

        }


        /* =================================================
           CARICA ORDINI
           ================================================= */

        async function loadOrders() {

            try {

                const response =
                    await fetch(
                        "/api/orders"
                    );


                if (
                    response.status === 401
                ) {

                    showLogin();

                    return;

                }


                const orders =
                    await response.json();


                allOrders =
                    Array.isArray(orders)
                        ? orders
                        : [];


                renderFilteredOrders();


            } catch (error) {

                console.error(
                    "Errore ordini:",
                    error
                );


                ordersContainer.innerHTML = `

                    <div class="empty">

                        Impossibile caricare
                        gli ordini.

                    </div>

                `;

            }

        }


        /* =================================================
           FILTRAGGIO
           ================================================= */

        function renderFilteredOrders() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const selectedStatus =
                statusFilter.value;


            const filtered =
                allOrders.filter(
                    order => {

                        const searchableText = [

                            order.order_number,

                            order.customer_name,

                            order.customer_email,

                            order.id

                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                        const matchesSearch =
                            !search ||
                            searchableText.includes(
                                search
                            );


                        const matchesStatus =
                            selectedStatus ===
                            "all"
                            ||
                            (
                                order.status ||
                                "paid"
                            ) ===
                            selectedStatus;


                        return (
                            matchesSearch &&
                            matchesStatus
                        );

                    }
                );


            resultsInfo.textContent =
                `${filtered.length} ordine/i visualizzato/i su ${allOrders.length}`;


            if (
                filtered.length === 0
            ) {

                ordersContainer.innerHTML = `

                    <div class="empty">

                        Nessun ordine corrisponde
                        ai filtri.

                    </div>

                `;

                return;

            }


            ordersContainer.innerHTML =
                filtered
                    .slice()
                    .reverse()
                    .map(
                        order =>
                            renderOrder(
                                order
                            )
                    )
                    .join("");

        }


        /* =================================================
           EVENTI FILTRI
           ================================================= */

        searchInput.addEventListener(
            "input",
            renderFilteredOrders
        );


        statusFilter.addEventListener(
            "change",
            renderFilteredOrders
        );


        clearFiltersButton.addEventListener(
            "click",
            function() {

                searchInput.value =
                    "";

                statusFilter.value =
                    "all";

                renderFilteredOrders();

            }
        );


        /* =================================================
           RENDER ORDINE
           ================================================= */

        function renderOrder(order) {

            const total =
                (
                    Number(
                        order.amount_total
                    ) / 100
                ).toFixed(2);


            const date =
                order.date
                    ? new Date(
                        order.date
                    ).toLocaleString(
                        "it-IT"
                    )
                    : "-";


            const products =
                (
                    order.products || []
                )
                .map(
                    product => `

                        <div class="product">

                            <span>

                                ${escapeHtml(
                                    product.name
                                )}

                                ×

                                ${product.quantity}

                            </span>

                            <span>

                                €${(
                                    Number(
                                        product.price
                                    )
                                    *
                                    Number(
                                        product.quantity
                                    )
                                    /
                                    100
                                ).toFixed(2)}

                            </span>

                        </div>

                    `
                )
                .join("");


            const shipping =
                order.shipping_address;


            let shippingHtml =
                "";


            if (shipping) {

                shippingHtml = `

                    <div class="shipping">

                        <strong>
                            📦 Indirizzo di spedizione
                        </strong>

                        <div>
                            ${escapeHtml(
                                shipping.line1 || ""
                            )}
                        </div>

                        ${
                            shipping.line2
                                ? `
                                    <div>
                                        ${escapeHtml(
                                            shipping.line2
                                        )}
                                    </div>
                                `
                                : ""
                        }

                        <div>

                            ${escapeHtml(
                                shipping.postal_code || ""
                            )}

                            ${escapeHtml(
                                shipping.city || ""
                            )}

                        </div>

                        <div>

                            ${escapeHtml(
                                shipping.state || ""
                            )}

                            ${escapeHtml(
                                shipping.country || ""
                            )}

                        </div>

                    </div>

                `;

            }


            const status =
                order.status ||
                "paid";


            return `

                <div class="order">

                    <div class="order-header">

                        <div>

                            <div class="order-number">

                                ${escapeHtml(
                                    order.order_number ||
                                    "ORDINE"
                                )}

                            </div>

                            <div class="stripe-id">

                                Stripe:
                                ${escapeHtml(
                                    order.id || "-"
                                )}

                            </div>

                            <small>

                                ${date}

                            </small>

                        </div>


                        <div>

                            <span
                                class="
                                    status
                                    ${getStatusClass(
                                        status
                                    )}
                                "
                            >

                                ${getStatusLabel(
                                    status
                                )}

                            </span>

                        </div>

                    </div>


                    <div class="customer">

                        <div>

                            <strong>
                                Cliente:
                            </strong>

                            ${escapeHtml(
                                order.customer_name ||
                                "-"
                            )}

                        </div>


                        <div>

                            <strong>
                                Email:
                            </strong>

                            ${escapeHtml(
                                order.customer_email ||
                                "-"
                            )}

                        </div>

                    </div>


                    ${shippingHtml}


                    <div class="products">

                        ${products}

                    </div>


                    <div class="total">

                        Totale:
                        €${total}

                    </div>


                    <div class="status-controls">

                        <strong>
                            Stato:
                        </strong>


                        <select
                            onchange="
                                changeOrderStatus(
                                    '${escapeAttribute(
                                        order.order_number
                                    )}',
                                    this.value
                                )
                            "
                        >

                            <option
                                value="paid"
                                ${status === "paid"
                                    ? "selected"
                                    : ""}
                            >
                                Pagato
                            </option>


                            <option
                                value="preparing"
                                ${status === "preparing"
                                    ? "selected"
                                    : ""}
                            >
                                In preparazione
                            </option>


                            <option
                                value="shipped"
                                ${status === "shipped"
                                    ? "selected"
                                    : ""}
                            >
                                Spedito
                            </option>


                            <option
                                value="delivered"
                                ${status === "delivered"
                                    ? "selected"
                                    : ""}
                            >
                                Consegnato
                            </option>

                        </select>

                    </div>

                </div>

            `;

        }


        /* =================================================
           CAMBIO STATO
           ================================================= */

        async function changeOrderStatus(
            orderNumber,
            newStatus
        ) {

            try {

                const response =
                    await fetch(
                        `/api/orders/${encodeURIComponent(
                            orderNumber
                        )}/status`,
                        {

                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    status:
                                        newStatus
                                })

                        }
                    );


                if (
                    response.status === 401
                ) {

                    showLogin();

                    return;

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.error ||
                        "Errore durante il cambio di stato."
                    );

                    return;

                }


                await loadEverything();

            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Errore di connessione."
                );

            }

        }


        /* =================================================
           STATI
           ================================================= */

        function getStatusLabel(status) {

            const labels = {

                paid:
                    "PAGATO",

                preparing:
                    "IN PREPARAZIONE",

                shipped:
                    "SPEDITO",

                delivered:
                    "CONSEGNATO"

            };


            return (
                labels[status] ||
                "PAGATO"
            );

        }


        function getStatusClass(status) {

            const classes = {

                paid:
                    "status-paid",

                preparing:
                    "status-preparing",

                shipped:
                    "status-shipped",

                delivered:
                    "status-delivered"

            };


            return (
                classes[status] ||
                "status-paid"
            );

        }


        /* =================================================
           SICUREZZA HTML
           ================================================= */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

        }


        function escapeAttribute(value) {

            return String(
                value ?? ""
            )
            .replaceAll(
                "\\",
                "\\\\"
            )
            .replaceAll(
                "'",
                "\\'"
            );

        }


        /* =================================================
           AVVIO
           ================================================= */

        checkLogin();

    </script>

</body>

</html>
